[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OsuPyParser"
version = "1.0.8"
description = "A powerful package for parsing .osu and .osr extention files"
readme = "README.md"
authors = [
    { name = "lenforiee", email = "lenforiee@misumi.me" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
requires-python = ">=3.6"
dependencies = []

[project.urls]
Homepage = "https://github.com/lenforiee/osupyparser"
